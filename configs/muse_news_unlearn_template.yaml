seed: 42
model:
  name_or_path: outputs/finetune/qwen3_5_2b_tofu_sft/model
  tokenizer_name_or_path: outputs/finetune/qwen3_5_2b_tofu_sft/model
  trust_remote_code: true
  device: auto
  dtype: bfloat16
  use_lora: true
  lora:
    r: 8
    alpha: 16
    dropout: 0.05
    target_modules: auto
  use_multimodal_loader: true
data:
  dataset_name: muse-bench/MUSE-News
  forget_config_name: knowmem
  forget_split: forget_qa
  forget_train_split: forget_qa
  retain_config_name: knowmem
  retain_split: retain_qa
  retain_train_split: retain_qa
  question_key: question
  answer_key: answer
  max_forget_train_samples: 80
  max_retain_train_samples: 80
  max_eval_samples: 100
  max_length: 256
  benchmark_eval: muse
  eval_max_length: 2048
  muse_eval_sets:
  - name: forget_knowledge
    dataset_name: muse-bench/MUSE-News
    config_name: knowmem
    split: forget_qa
    prompt_key: question
    answer_key: answer
    max_samples: 100
  - name: retain_knowledge
    dataset_name: muse-bench/MUSE-News
    config_name: knowmem
    split: retain_qa
    prompt_key: question
    answer_key: answer
    max_samples: 100
  prompt_format: chat_template
saliency:
  mode: grad_abs
  batches: 8
  batch_size: 1
  retain_quantile: 0.9
  forget_quantile: 0.7
  eps: 1.0e-08
mask:
  method: probe
probe:
  batches: 8
  batch_size: 1
  retain_quantile: 0.9
  forget_quantile: 0.7
  module_filter: trainable
  unmapped: neutral
  grouping: relative
  activity_quantile: 0.1
  margin_quantile: 0.05
unlearn:
  objective: grad_diff
  wrappers:
  - none
  - forget_only
  - cadmu
  steps: 100
  batch_size: 1
  lr: 0.0002
  alpha_forget: 1.5
  beta_retain: 1.0
  npo_beta: 1.0
  projection_eps: 1.0e-12
eval:
  batch_size: 1
  max_new_tokens: 64
output_dir: outputs/muse_news_unlearn_template
save_models: false
