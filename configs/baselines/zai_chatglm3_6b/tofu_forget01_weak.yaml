seed: 42
model:
  name_or_path: outputs/finetune/zai_chatglm3_6b_tofu_sft/model
  tokenizer_name_or_path: outputs/finetune/zai_chatglm3_6b_tofu_sft/model
  trust_remote_code: true
  device: auto
  dtype: bfloat16
  use_lora: true
  lora:
    r: 8
    alpha: 16
    dropout: 0.05
    target_modules: auto
data:
  dataset_name: locuslab/TOFU
  split: train
  forget_split: forget01
  retain_split: retain99
  forget_perturbed_split: forget01_perturbed
  retain_perturbed_split: retain_perturbed
  holdout_split: holdout01
  real_authors_split: real_authors_perturbed
  world_facts_split: world_facts_perturbed
  max_forget_train_samples: 80
  max_retain_train_samples: 160
  max_eval_samples: 40
  max_length: 256
saliency:
  mode: grad_abs
  batches: 8
  batch_size: 1
  retain_quantile: 0.9
  forget_quantile: 0.7
  eps: 1.0e-08
mask:
  method: probe
probe:
  batches: 8
  batch_size: 1
  retain_quantile: 0.9
  forget_quantile: 0.7
  module_filter: trainable
  unmapped: neutral
  grouping: relative
  activity_quantile: 0.1
  margin_quantile: 0.05
unlearn:
  baselines:
  - grad_ascent
  - grad_diff
  - npo
  - dpo
  - simnpo
  - rmu
  - kl
  - retrain
  - forget_only_grad_ascent
  - forget_only_grad_diff
  - forget_only_npo
  - forget_only_dpo
  - forget_only_simnpo
  - forget_only_rmu
  - forget_only_kl
  - forget_only_retrain
  - cadmu_grad_ascent
  - cadmu_grad_diff
  - cadmu_npo
  - cadmu_dpo
  - cadmu_simnpo
  - cadmu_rmu
  - cadmu_kl
  - cadmu_retrain
  steps: 100
  batch_size: 1
  lr: 0.0002
  alpha_forget: 1.0
  beta_retain: 1.5
  npo_beta: 1.0
  dpo_beta: 1.0
  simnpo_beta: 1.0
  rmu_target_scale: 1.0
  projection_eps: 1.0e-12
  shared_methods: []
eval:
  batch_size: 1
  max_new_tokens: 48
output_dir: outputs/baselines/zai_chatglm3_6b/tofu_forget01_weak
save_models: false
