seed: 42
model:
  name_or_path: locuslab/tofu_ft_llama2-7b
  tokenizer_name_or_path: locuslab/tofu_ft_llama2-7b
  trust_remote_code: false
  device: auto
  dtype: float16
  use_lora: true
  lora:
    r: 8
    alpha: 16
    dropout: 0.05
    target_modules: auto
  use_multimodal_loader: true
data:
  dataset_name: locuslab/TOFU
  split: train
  forget_split: forget10
  retain_split: retain90
  forget_perturbed_split: forget10_perturbed
  retain_perturbed_split: retain_perturbed
  holdout_split: holdout10
  real_authors_split: real_authors_perturbed
  world_facts_split: world_facts_perturbed
  max_forget_train_samples: 80
  max_retain_train_samples: 160
  max_eval_samples: 40
  max_length: 256
saliency:
  mode: grad_abs
  batches: 8
  batch_size: 1
  retain_quantile: 0.9
  forget_quantile: 0.7
  eps: 1.0e-08
mask:
  method: saliency
probe:
  batches: 8
  batch_size: 1
  retain_quantile: 0.9
  forget_quantile: 0.7
  module_filter: trainable
  unmapped: neutral
unlearn:
  baselines:
  - grad_ascent
  - grad_diff
  - npo
  - cadmu_grad_ascent
  - cadmu_grad_diff
  - cadmu_npo
  steps: 30
  batch_size: 1
  lr: 0.0002
  alpha_forget: 2.0
  beta_retain: 1.0
  npo_beta: 1.0
  projection_eps: 1.0e-12
eval:
  batch_size: 1
  max_new_tokens: 48
output_dir: outputs/open_tofu_llama2
save_models: false
