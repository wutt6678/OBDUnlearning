seed: 42
model:
  name_or_path: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
  tokenizer_name_or_path: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
  trust_remote_code: true
  device: auto
  dtype: bfloat16
  use_lora: true
  use_multimodal_loader: true
  lora:
    r: 16
    alpha: 32
    dropout: 0.0
    target_modules: auto
data:
  dataset_name: muse-bench/MUSE-News
  dataset_format: muse
  max_length: 2048
  prompt_format: chat_template
  question_key: question
  answer_key: answer
  splits:
  - name: knowmem
    split: forget_qa
  - name: knowmem
    split: retain_qa
train:
  epochs: 10
  batch_size: 1
  gradient_accumulation_steps: 4
  lr: 1.0e-05
  weight_decay: 0.0
  max_grad_norm: 1.0
  log_every: 5
output_dir: outputs/finetune/deepseek_r1_distill_qwen_1_5b_muse_news_qa_sft
