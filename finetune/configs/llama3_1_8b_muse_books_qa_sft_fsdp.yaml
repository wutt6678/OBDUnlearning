seed: 42
model:
  name_or_path: meta-llama/Llama-3.1-8B-Instruct
  tokenizer_name_or_path: meta-llama/Llama-3.1-8B-Instruct
  trust_remote_code: false
  device: auto
  dtype: float16
  use_lora: true
  lora:
    r: 16
    alpha: 32
    dropout: 0.0
    target_modules: auto
  use_multimodal_loader: true
data:
  dataset_name: muse-bench/MUSE-Books
  dataset_format: muse
  max_length: 2048
  prompt_format: chat_template
  question_key: question
  answer_key: answer
  splits:
  - name: knowmem
    split: forget_qa
  - name: knowmem
    split: retain_qa
train:
  epochs: 10
  batch_size: 1
  gradient_accumulation_steps: 4
  lr: 1.0e-05
  weight_decay: 0.0
  max_grad_norm: 1.0
  log_every: 5
  distributed: fsdp
  fsdp_mixed_precision: float16
  fsdp_cpu_offload: true
  fsdp_use_orig_params: true
  fsdp_wrap_policy: transformer_block
  fsdp_align_param_dtype: true
  gradient_checkpointing: false
  fsdp_batch_size_mode: per_rank
output_dir: outputs/finetune/llama3_1_8b_muse_books_qa_sft
