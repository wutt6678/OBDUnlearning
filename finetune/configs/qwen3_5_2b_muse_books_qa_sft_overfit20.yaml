seed: 42
model:
  name_or_path: Qwen/Qwen3.5-2B
  tokenizer_name_or_path: Qwen/Qwen3.5-2B
  trust_remote_code: true
  device: auto
  dtype: bfloat16
  use_lora: true
  lora:
    r: 16
    alpha: 32
    dropout: 0.0
    target_modules: auto
  use_multimodal_loader: true
data:
  dataset_name: muse-bench/MUSE-Books
  dataset_format: muse
  max_length: 2048
  prompt_format: chat_template
  question_key: question
  answer_key: answer
  splits:
  - name: knowmem
    split: forget_qa
    max_samples: 20
  - name: knowmem
    split: retain_qa
    max_samples: 20
train:
  epochs: 30
  batch_size: 1
  gradient_accumulation_steps: 1
  lr: 5.0e-05
  weight_decay: 0.0
  max_grad_norm: 1.0
  log_every: 10
output_dir: outputs/finetune/qwen3_5_2b_muse_books_qa_sft_overfit20
