seed: 42
model:
  name_or_path: outputs/finetune/ministral3_3b_instruct_tofu_sft/model
  tokenizer_name_or_path: outputs/finetune/ministral3_3b_instruct_tofu_sft/model
  trust_remote_code: true
  device: auto
  dtype: bfloat16
  use_lora: false
  use_multimodal_loader: true
data:
  dataset_name: locuslab/TOFU
  split: train
  forget_perturbed_split: forget10_perturbed
  retain_perturbed_split: retain_perturbed
  holdout_split: holdout10
  real_authors_split: real_authors_perturbed
  world_facts_split: world_facts_perturbed
  max_eval_samples: 40
  max_length: 512
eval:
  batch_size: 1
  max_new_tokens: 48
output_dir: outputs/finetune/ministral3_3b_instruct_tofu_sft_eval
